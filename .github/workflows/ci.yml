name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Type-check both packages' Runtime/**/*.cs (com.ezoic.ads at the root, com.ezoic.cmp-sdk in
  # com.ezoic.cmp-sdk~/) against real Unity 2022.3 managed assemblies, under the Android, iOS and
  # plain (editor / unsupported) define sets. No Unity license used.
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Unity managed assemblies
        id: cache-unity
        uses: actions/cache@v4
        with:
          path: ~/unity-managed
          key: unity-managed-2022.3.62f3

      - name: Download Unity managed assemblies
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/unity-managed"
          curl -fL -o /tmp/Unity.tar.xz \
            https://download.unity3d.com/download_unity/96770f904ca7/LinuxEditorInstaller/Unity.tar.xz
          # Extract only the managed UnityEngine DLLs, flattened directly into ~/unity-managed.
          tar --wildcards --no-same-owner --strip-components=4 \
            -xf /tmp/Unity.tar.xz \
            -C "$HOME/unity-managed" \
            'Editor/Data/Managed/UnityEngine/*.dll'
          rm -f /tmp/Unity.tar.xz
          ls "$HOME/unity-managed" | head

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Compile (Android define set)
        run: >-
          dotnet build tools/compile/Ezoic.Ads.Android.csproj
          -p:UnityManagedPath=$HOME/unity-managed
          -warnaserror

      - name: Compile (iOS define set)
        run: >-
          dotnet build tools/compile/Ezoic.Ads.iOS.csproj
          -p:UnityManagedPath=$HOME/unity-managed
          -warnaserror

      - name: Compile (Editor / no-platform define set)
        run: >-
          dotnet build tools/compile/Ezoic.Ads.Editor.csproj
          -p:UnityManagedPath=$HOME/unity-managed
          -warnaserror

      - name: Compile com.ezoic.cmp-sdk (Android, iOS, Editor define sets)
        run: |
          set -euo pipefail
          for variant in Android iOS Editor; do
            dotnet build "tools/compile/Ezoic.Cmp.$variant.csproj" \
              -p:UnityManagedPath="$HOME/unity-managed" \
              -warnaserror
          done

  # Unit tests for the platform-independent mapping code of both packages (consent outcomes,
  # iOS ABI value encodings). Plain .NET; no Unity assemblies.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        run: dotnet test "tools/tests~/Ezoic.Unity.Tests.csproj"

  # Verify every JNI class/method name the Android bridges use exists in the published AARs.
  # From native 1.22.0 the com.ezoic.ads.sdk.privacy.cmp classes ship in ezoic-cmp-sdk, so both
  # AARs are downloaded. The CMP package's names are also audited against the CMP AAR alone,
  # since com.ezoic.cmp-sdk installs without the ads library.
  jni-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download AARs and extract classes
        # Audits the exact versions the two EDM manifests pin.
        shell: bash
        run: |
          set -euo pipefail
          spec_version() {
            python3 -c "import sys, xml.etree.ElementTree as ET; s = ET.parse(sys.argv[1]).find('.//androidPackage').get('spec'); g, a, v = s.split(':'); assert (g, a) == ('com.ezoic.sdk', sys.argv[2]), s; print(v)" "$1" "$2"
          }
          ads_version="$(spec_version Editor/EzoicDependencies.xml ezoic-ads-sdk)"
          cmp_version="$(spec_version 'com.ezoic.cmp-sdk~/Editor/EzoicCmpDependencies.xml' ezoic-cmp-sdk)"
          if [ "$ads_version" != "$cmp_version" ]; then
            echo "::error::ezoic-ads-sdk $ads_version and ezoic-cmp-sdk $cmp_version must be the same version"
            exit 1
          fi
          for artifact in ezoic-ads-sdk ezoic-cmp-sdk; do
            echo "Auditing com.ezoic.sdk:$artifact:$ads_version"
            curl -fL -o "$artifact.aar" \
              "https://repo1.maven.org/maven2/com/ezoic/sdk/$artifact/$ads_version/$artifact-$ads_version.aar"
            unzip -o "$artifact.aar" classes.jar -d "aar_extract/$artifact"
            mkdir -p "aar_classes/$artifact"
            (cd "aar_classes/$artifact" && jar xf "../../aar_extract/$artifact/classes.jar")
          done

      - name: Run JNI signature audit (both packages, both AARs)
        run: AAR_CLASSES="$PWD/aar_classes/ezoic-ads-sdk:$PWD/aar_classes/ezoic-cmp-sdk" python3 tools/audit-jni.py

      - name: Run JNI signature audit (com.ezoic.cmp-sdk against ezoic-cmp-sdk alone)
        run: >-
          JNI_NAMES='com.ezoic.cmp-sdk~/Runtime/Android/CmpJniNames.cs'
          AAR_CLASSES="$PWD/aar_classes/ezoic-cmp-sdk"
          python3 tools/audit-jni.py

  # Type-check both packages' Swift bridges against the SwiftPM distribution
  # (ezoic-swift-sdk-dist) so a rename or signature drift in the native SDK breaks CI
  # here rather than in a publisher's Xcode build: com.ezoic.ads' bridge against the
  # EzoicAdsSDK product, com.ezoic.cmp-sdk's against EzoicCmpSDK alone, and both
  # bridges in one module (as UnityFramework compiles them when an app installs both
  # packages) against both products. These are the packages EDM adds with Swift
  # Package Manager Integration on; from 1.22.0 there is no CocoaPod to check.
  # Compiles only — no simulator boot, no tests.
  swift-bridge:
    runs-on: macos-26
    # Cold checkout resolves and builds the dist graph (Prebid Mobile, GMA) from
    # source, so give the build generous headroom.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.6
        # EzoicAdsSDK 1.15+ resolves Google Mobile Ads 13.x, which needs Xcode 26.2+.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Stage bridge sources into the type-check package
        # The scratch package commits only a .gitkeep in each target dir; copy the
        # real bridge sources in so xcodebuild has something to compile. These
        # copies are gitignored (tools/swift-typecheck/.gitignore) and never
        # committed, keeping the single source of truth in each package's
        # Runtime/Plugins/iOS.
        run: |
          set -euo pipefail
          src="tools/swift-typecheck/Sources"
          shopt -s nullglob
          ads=(Runtime/Plugins/iOS/*.swift)
          cmp=(com.ezoic.cmp-sdk~/Runtime/Plugins/iOS/*.swift)
          if [ ${#ads[@]} -eq 0 ] || [ ${#cmp[@]} -eq 0 ]; then
            echo "::error::Missing Swift bridge sources (ads: ${#ads[@]}, cmp: ${#cmp[@]})"
            exit 1
          fi
          cp "${ads[@]}" "$src/EzoicUnityBridgeCheck/"
          cp "${cmp[@]}" "$src/EzoicCmpUnityBridgeCheck/"
          cp "${ads[@]}" "${cmp[@]}" "$src/EzoicBothUnityBridgeCheck/"
          ls -1 "$src"/*/

      - name: Type-check the Swift bridges
        working-directory: tools/swift-typecheck
        run: |
          set -euo pipefail
          echo "::group::Available schemes"
          xcodebuild -list
          echo "::endgroup::"

          # One scheme per library product. `generic/platform=iOS Simulator`
          # compiles for the simulator SDK without booting a device.
          for scheme in EzoicUnityBridgeCheck EzoicCmpUnityBridgeCheck EzoicBothUnityBridgeCheck; do
            echo "::group::$scheme"
            xcodebuild build \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -skipPackagePluginValidation \
              COMPILER_INDEX_STORE_ENABLE=NO
            echo "::endgroup::"
          done

  # Assert, per package, that the Swift @_cdecl export set and the C#
  # [DllImport("__Internal")] extern set are identical — same names, same parameter
  # counts, both directions — and that no name is exported by both packages (both
  # bridges link into UnityFramework when an app installs both).
  extern-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run extern signature audit
        run: python3 tools/audit-extern.py

  # Structural validation of both packages' manifests, assembly definitions and EDM manifests,
  # and that every native and package version pin agrees.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate both packages and their pins
        run: python3 tools/validate-packages.py
